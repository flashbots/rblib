name: Sanity Check
on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  fmt:
    name: Rustfmt
    runs-on: warp-ubuntu-latest-x64-32x
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust toolchain
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-nightly-fmt-${{ hashFiles('**/Cargo.lock') }}
      - name: Set up Rust Nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: false
          components: rustfmt
      - name: Run Rustfmt with nightly
        run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: warp-ubuntu-latest-x64-32x
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust toolchain
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-stable-clippy-all-${{ hashFiles('**/Cargo.lock') }}
      - name: Set up Rust Stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy
      - name: Run Clippy with stable
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  clippy-no-default:
    name: Clippy (no default features)
    runs-on: warp-ubuntu-latest-x64-32x
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust toolchain
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-stable-clippy-nodefault-${{ hashFiles('**/Cargo.lock') }}
      - name: Set up Rust Stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy
      - name: Run Clippy with stable
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  typos:
    name: Typos
    runs-on: warp-ubuntu-latest-x64-32x
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1

  test:
    name: Tests
    runs-on: warp-ubuntu-latest-x64-32x
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust toolchain
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-stable-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Set up Rust Stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Run tests with stable
        run: cargo test --workspace --lib --bins --tests --examples --all-features

  doc:
    name: Docs
    runs-on: warp-ubuntu-latest-x64-32x
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust toolchain
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-stable-doc-${{ hashFiles('**/Cargo.lock') }}
      - name: Set up Rust Stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --all-features --examples